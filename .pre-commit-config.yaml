# Pre-commit configuration for BlackArch repository
repos:
  - repo: local
    hooks:
      - id: pkgbuild-syntax-check
        name: PKGBUILD Syntax & Convention Check
        entry: python3 scripts/bautil.py check
        language: system
        files: ^packages/.*/PKGBUILD$

      - id: pkgbuild-prep-format
        name: PKGBUILD Format Sanitizer
        entry: python3 scripts/bautil.py prep
        language: system
        files: ^packages/.*/PKGBUILD$
