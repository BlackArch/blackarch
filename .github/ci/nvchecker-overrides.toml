# Hand-written nvchecker entries for packages the generator can't track (or
# tracks wrongly). Anything here replaces the generated entry for that package.
# Syntax: https://nvchecker.readthedocs.io/en/latest/usage.html
#
# The version nvchecker reports must be directly comparable to the PKGBUILD's
# pkgver (release packages) or be the upstream commit hash (packages with a
# pkgver() function).
#
# ["some-tool"]                       # tag "release-1.2.3" -> 1.2.3
# source = "github"
# github = "owner/some-tool"
# use_max_tag = true
# include_regex = 'release-[0-9.]+'
# prefix = "release-"
#
# ["packetstorm-tool"]                # scrape a download page
# source = "regex"
# url = "https://example.org/downloads/"
# regex = 'tool-([0-9.]+)\.tar\.gz'
#
# ["dev-branch-tool"]                 # VCS package following a non-default branch
# source = "git"
# git = "https://github.com/owner/dev-branch-tool.git"
# use_commit = true
# branch = "dev"
