name: CI
on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
  pull_request:
    branches: [master]
    paths:
      - 'packages/**'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    container:
      image: blackarchlinux/blackarch:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git pkgcheck-arch namcap nodejs python3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up remotes and tags
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add upstream "https://github.com/BlackArch/blackarch.git" 2>/dev/null || true
          git fetch --tags origin 2>/dev/null || true
          git fetch upstream master 2>/dev/null || true
      - name: Run BlackArch Package Verification
        run: |
          python3 scripts/bautil.py check
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            DIFF_TARGET="upstream/master...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            DIFF_TARGET="${{ github.event.before }}...${{ github.sha }}"
          else
            DIFF_TARGET="upstream/master...HEAD"
          fi
          CHANGED_FILES=($(git diff --name-only --diff-filter=ACMRT $DIFF_TARGET 2>/dev/null | tr '\n' ' '))
          for FILE in "${CHANGED_FILES[@]}"; do
             if [[ $(basename "$FILE") == "PKGBUILD" ]]; then
               echo "Validating $FILE with pkgcheck..."
               pkgcheck "$FILE" || true
             fi
          done
  build:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
         with:
           fetch-depth: 0
       - name: Set up remotes and tags
         run: |
           git config --global --add safe.directory "$GITHUB_WORKSPACE"
           git remote add upstream "https://github.com/BlackArch/blackarch.git" 2>/dev/null || true
           git fetch --tags origin 2>/dev/null || true
           git fetch upstream master 2>/dev/null || true          
       - name: Build Package
         run: |
           if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
             DIFF_TARGET="upstream/master...${{ github.event.pull_request.head.sha }}"
           elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
             DIFF_TARGET="${{ github.event.before }}...${{ github.sha }}"
           else
             DIFF_TARGET="upstream/master...HEAD"
           fi
           CHANGED_FILES=($(git diff --name-only --diff-filter=ACMRT $DIFF_TARGET 2>/dev/null | tr '\n' ' '))
           for FILE in "${CHANGED_FILES[@]}"; do
              if [[ $(basename "$FILE") == "PKGBUILD" ]]; then
                echo "Building $FILE..."
                docker build --load -t builder -f travis/Dockerfile $(dirname "$FILE")
                docker run --rm builder
              fi
           done
