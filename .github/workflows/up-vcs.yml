name: VCS Upstream Check
on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

jobs:
  check-vcs:
    runs-on: ubuntu-latest
    container:
      image: blackarchlinux/blackarch:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git python3
      - name: Run VCS Version Check
        run: |
          python3 scripts/bautil.py check
          ./scripts/up-vcs-tools || true
